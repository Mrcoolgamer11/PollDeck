# PollDeck – selbst gehostete interaktive Präsentations- und Abstimmungsplattform
# Start:  cp .env.example .env  →  Werte anpassen  →  docker compose up -d --build

name: polldeck

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: polldeck-web:latest
    container_name: polldeck-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - polldeck_internal
      - reverse-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: polldeck-api:latest
    container_name: polldeck-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-polldeck}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polldeck}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polldeck_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"

  postgres:
    image: postgres:16-alpine
    container_name: polldeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polldeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-polldeck}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - polldeck_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=false"

  redis:
    image: redis:7-alpine
    container_name: polldeck-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - ./data/redis:/data
    networks:
      - polldeck_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=false"

networks:
  reverse-proxy:
    external: true
  polldeck_internal:
